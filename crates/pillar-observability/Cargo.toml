[package]
name = "pillar-observability"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Built-in distributed observability riding the streaming DB: configurable-size immutable timeseries blocks, retention/compaction, metadata sampling, raw-query + materialized-view caching, and signed node-role config gated by the single WoT/RBAC read-authority decider — the Rust refinement of specs/Observability.tla."

[dependencies]
pillar-core = { path = "../pillar-core" }
# `default-features = false`: pillar-observability only ever tags signals with
# a pure content address (`pillar_streamdb::{OpId, content_address}`) and never
# touches the IPFS-backed durability substrate, so it opts out of the `ipfs`
# feature (which pulls `pillar-ipfs` -> `libp2p` -> tokio/mio, not portable to
# `wasm32-unknown-unknown`) — keeping the `pillar-frontend` wasm build's
# dependency closure out of that unwanted edge entirely. See
# crates/pillar-streamdb/Cargo.toml's `ipfs` feature doc.
pillar-streamdb = { path = "../pillar-streamdb", default-features = false }
pillar-wot-authority = { path = "../pillar-wot-authority" }
pillar-manifest = { path = "../pillar-manifest" }
pillar-topology = { path = "../pillar-topology" }
sha2 = "0.10"

[lints]
workspace = true
