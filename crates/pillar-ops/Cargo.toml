[package]
name = "pillar-ops"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The shared Pillar op vocabulary: the CRUD streamdb operations (apply/delete a resource CRD) that every producer — the CLI, the node's own portal, and the browser client — encodes identically into a streamdb op payload. Payload-only and wasm-safe (no transport/seal deps); the Body-wrap/seal/sign lives in the native client/transport layer."

[dependencies]
pillar-manifest = { path = "../pillar-manifest" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
