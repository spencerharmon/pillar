[package]
name = "pillar-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The `pillar` kubectl-style CLI: apply/get/describe over signed manifests. apply signs a CRD into a pillar-native envelope and emits a WoT-authorized signed event; get/describe render a materialized view of events (status is a view, never written back); kustomize (text) and helm-as-renderer reuse produce CRD bodies that apply."

[[bin]]
name = "pillar"
path = "src/main.rs"

[dependencies]
pillar-core = { path = "../pillar-core" }
pillar-bootstrap = { path = "../pillar-bootstrap" }
pillar-manifest = { path = "../pillar-manifest" }
pillar-eventlog = { path = "../pillar-eventlog" }
pillar-wot-authority = { path = "../pillar-wot-authority" }
pillar-rbac = { path = "../pillar-rbac" }
pillar-identity = { path = "../pillar-identity" }
pillar-trust-artifacts = { path = "../pillar-trust-artifacts" }
pillar-topology = { path = "../pillar-topology" }
pillar-key-distribution = { path = "../pillar-key-distribution" }
pillar-web = { path = "../pillar-web" }
pillar-web-api = { path = "../pillar-web-api" }
pillar-net = { path = "../pillar-net" }
pillar-streamdb = { path = "../pillar-streamdb" }
pillar-swarm = { path = "../pillar-swarm" }
pillar-controller = { path = "../pillar-controller" }
pillar-coordination = { path = "../pillar-coordination" }
pillar-observability = { path = "../pillar-observability" }
pillar-wire = { path = "../pillar-wire" }
pillar-cells = { path = "../pillar-cells" }
pillar-ops = { path = "../pillar-ops" }
pillar-client = { path = "../pillar-client" }
pillar-crypto = { path = "../pillar-crypto", default-features = false }
pillar-iam = { path = "../pillar-iam" }
pillar-oidc = { path = "../pillar-oidc" }
libp2p = { version = "0.56", features = ["ed25519"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
sha2 = "0.10"
base64 = "0.22"

[features]
# Default keeps the everyday `cargo build -p pillar-cli` / `cargo test --all`
# fast — no HSM bindgen crates or native libs. The deployed node turns them on:
# the flake builds `-p pillar-cli --features hsm`, so every shipped `pillar`
# binary carries every popular hardware custody backend.
default = []
hsm = ["pillar-crypto/hsm", "passkey"]
# CLI-driven CTAP2 WebAuthn ceremonies (registration/assertion) over ctap-hid
# against a locally attached hardware authenticator — `pillar webauthn
# register|login`. Folded into `hsm` (every deployed node build) and
# available standalone for a WebAuthn-only build.
passkey = ["pillar-crypto/passkey"]
# Opt-in acceptance gate for black-box integration tests that stand the real
# node web surface up on a real TCP socket and drive it over real HTTP (never
# an in-process call). Off by default so a plain `cargo test -p pillar-cli` /
# `cargo test --all` stays a fast unit run; the `acceptance-e2e` CHECKS.md stub
# always invokes `--features acceptance` explicitly. The `tests/portal_swarm_surface`
# suite is `#![cfg(feature = "acceptance")]`-gated on this.
acceptance = []

[dev-dependencies]
tempfile = "3"
ciborium = "0.2"

[lints]
workspace = true
