[package]
name = "pillar-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The `pillar` kubectl-style CLI: apply/get/describe over signed manifests. apply signs a CRD into a pillar-native envelope and emits a WoT-authorized signed event; get/describe render a materialized view of events (status is a view, never written back); kustomize (text) and helm-as-renderer reuse produce CRD bodies that apply."

[[bin]]
name = "pillar"
path = "src/main.rs"

[dependencies]
pillar-core = { path = "../pillar-core" }
pillar-bootstrap = { path = "../pillar-bootstrap" }
pillar-manifest = { path = "../pillar-manifest" }
pillar-eventlog = { path = "../pillar-eventlog" }
pillar-wot-authority = { path = "../pillar-wot-authority" }
pillar-rbac = { path = "../pillar-rbac" }
pillar-identity = { path = "../pillar-identity" }
pillar-web = { path = "../pillar-web" }
pillar-net = { path = "../pillar-net" }
pillar-streamdb = { path = "../pillar-streamdb" }
pillar-controller = { path = "../pillar-controller" }
pillar-coordination = { path = "../pillar-coordination" }
pillar-observability = { path = "../pillar-observability" }
libp2p = { version = "0.56", features = ["ed25519"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
