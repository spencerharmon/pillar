[package]
name = "pillar-net"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "libp2p transport substrate for Pillar: gossipsub event log, Kademlia discovery, relay/dcutr NAT traversal."

[features]
# Opt-in acceptance gate for the public-seed UPnP external-address reachability
# vertical (definition-of-done for `public-seed-upnp-external-addr`). The test
# it enables (`tests/public_seed_upnp_external_addr.rs`) exercises the REAL
# swarm behaviour: a `--upnp`-enabled event swarm actually carries an active
# UPnP/NAT-PMP mapping behaviour, and a discovered external multiaddr enters the
# swarm's advertised external-address set (the exact set libp2p `identify`
# broadcasts to peers), while a UPnP-off swarm leaves the behaviour inert. It is
# off by default so the ordinary `cargo test` unit run does not require it.
#
# The same feature also gates `tests/pillar_udp_preferred_transport.rs`, which
# stands up real libp2p swarms over real sockets to prove the corrected
# transport posture (pillar-UDP preferred; QUIC/TCP fallback) end to end. Both
# acceptance-tier tests share this single off-by-default gate.
#
# It further gates `tests/pillar_udp_session_key.rs`, the acceptance proof of
# the portable cell-minted pillar-UDP session-key scheme
# (`docs/papers/pillar-udp-encryption.md`): over real UDP sockets and a real
# libp2p swarm it proves K_s portability across ingress nodes,
# authorize-before-serve, CID-dedup replay defense, ed25519 sender identity,
# revocation + GC-erase, anonymous-as-policy, and clean legacy-peer negotiation
# refusal.
acceptance = []

[dependencies]
pillar-crypto = { path = "../pillar-crypto" }
# The `PillarMessage` envelope (version-stamped, cell-sealed, content-addressed)
# every libp2p control payload is wrapped in before a pillar-UDP datagram is
# sealed to the peer's WoT static X25519 key (handshakeless cutover, method #1
# step (f)). pillar-wire depends only on pillar-crypto/pillar-core/pillar-ipfs,
# never on pillar-net, so this edge is acyclic.
pillar-wire = { path = "../pillar-wire" }
libp2p = { version = "0.56", features = [
    "gossipsub",
    "kad",
    "relay",
    "dcutr",
    "identify",
    "ping",
    "noise",
    "yamux",
    "tcp",
    "quic",
    "dns",
    "tokio",
    "macros",
    "upnp",
    "request-response",
    "cbor",
    "pnet",
] }
pillar-streamdb = { path = "../pillar-streamdb" }
pillar-eventlog = { path = "../pillar-eventlog" }
pillar-core = { path = "../pillar-core" }
pillar-ipam = { path = "../pillar-ipam" }
# The live UDP ingress dataplane (udp_dataplane) rides the manifest LB policy
# types (LoadBalancerPolicy/Algorithm/Affinity) so backend selection is the
# manifest's own decision, not a parallel one. pillar-manifest does not depend
# on pillar-net, so this is acyclic.
pillar-manifest = { path = "../pillar-manifest" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
tracing = "0.1"
sha3 = "0.10.9"
# The portable cell-minted pillar-UDP session key (pillarmsg_session) derives
# K_s via HKDF-SHA256 over an X25519 ECDH shared secret and a convergent
# transport-frame nonce, matching pillar-crypto's own HKDF-SHA256 derivations.
sha2 = "0.10"
hkdf = "0.12"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Dev-only: proves the overlay mesh metadata round-trips through the
# streaming DB. NOT a runtime dependency of the substrate crate itself —
# the substrate (build_event_swarm et al.) never depends on pillar-streamdb,
# which is exactly the "overlay never a bootstrap dep of the substrate"
# invariant this task requires.
pillar-streamdb = { path = "../pillar-streamdb" }
# Dev-only: builds a TopologyScopedIpam fixture for the pillar-UDP reply-set
# determinism test. Not a runtime dep (pillar-ipam is; topology comes through it).
pillar-topology = { path = "../pillar-topology" }
# Dev-only: the distributed-lb-acceptance test composes the ingress/LB
# manifest model (Route/Frontend/derive_routing_table) and the WoT trust
# artifacts gating Route attachment. (pillar-manifest is now a runtime dep of
# this crate for the UDP dataplane, above.)
pillar-trust-artifacts = { path = "../pillar-trust-artifacts" }
# Dev-only: the network-root pnet acceptance test (`tests/network_root_pnet.rs`,
# gated by the `acceptance` feature) asserts the PUBLIC default derives its pnet
# key from the published `pillar_swarm::PUBLIC_PILLAR_ROOT` (never a keyless
# `disabled()` transport) and that ONE root feeds BOTH the event-log pnet key
# (this crate) AND the IPFS pnet key (`pillar-ipfs`) via each crate's
# domain-separated `PrivateSwarmKey::from_root_secret`. Both are DEV-only: the
# runtime substrate never depends on either (pillar-swarm carries the shared key
# model; the pillar-ipfs edge is a dev-dependency cycle, which cargo permits —
# it never becomes a build/runtime dependency of pillar-net).
pillar-swarm = { path = "../pillar-swarm" }
pillar-ipfs = { path = "../pillar-ipfs" }

[lints]
workspace = true
