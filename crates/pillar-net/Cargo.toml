[package]
name = "pillar-net"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "libp2p transport substrate for Pillar: gossipsub event log, Kademlia discovery, relay/dcutr NAT traversal."

[dependencies]
libp2p = { version = "0.56", features = [
    "gossipsub",
    "kad",
    "relay",
    "dcutr",
    "identify",
    "ping",
    "noise",
    "yamux",
    "tcp",
    "quic",
    "tokio",
    "macros",
    "upnp",
    "request-response",
    "cbor",
] }
pillar-streamdb = { path = "../pillar-streamdb" }
pillar-eventlog = { path = "../pillar-eventlog" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Dev-only: proves the overlay mesh metadata round-trips through the
# streaming DB. NOT a runtime dependency of the substrate crate itself —
# the substrate (build_event_swarm et al.) never depends on pillar-streamdb,
# which is exactly the "overlay never a bootstrap dep of the substrate"
# invariant this task requires.
pillar-streamdb = { path = "../pillar-streamdb" }

[lints]
workspace = true
