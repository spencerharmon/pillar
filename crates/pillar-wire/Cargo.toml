[package]
name = "pillar-wire"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The shared-substrate crate for every byte Pillar persists or transmits: the versioned PillarMessage envelope, its canonical (deterministic) CBOR codec, Cid derivation, and the convergent content-seal interface. Owns SignedSegment/Cid/HeadRecord/Visibility/ContentStore/IpfsBackend (moved down from pillar-streamdb). Depends only downward onto pillar-crypto/pillar-core/pillar-ipfs; pillar-streamdb, pillar-observability, and pillar-net depend on THIS crate, never the reverse."

[features]
# The durable IPFS-node-backed substrate (`NativeIpfsBackend`, CIDv1 wire
# codecs) that rides `pillar-ipfs` -> `libp2p`. Mirrors the same feature gate
# `pillar-streamdb` used to carry directly, now owned here since the store
# moved down. On by default for every native consumer; a wasm32 consumer
# (`pillar-observability` via `pillar-web-frontend`) depends with
# `default-features = false` to keep the libp2p closure out of its build.
default = ["ipfs"]
ipfs = ["dep:pillar-ipfs"]

[dependencies]
pillar-crypto = { path = "../pillar-crypto" }
pillar-core = { path = "../pillar-core" }
pillar-ipfs = { path = "../pillar-ipfs", optional = true }
sha2 = "0.10"
tracing = "0.1"
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }

# `pillar-crypto`'s signature/sealing primitives (p256/p384/p521/rsa via
# `rand_core`) pull `getrandom` v0.2 for their CSPRNG seeding. `getrandom` v0.2
# refuses `wasm32-unknown-unknown` by default (it cannot assume a Web Crypto
# API is present) unless its `js` backend is explicitly enabled — the exact
# reason a plain `cargo build -p pillar-wire --no-default-features --target
# wasm32-unknown-unknown` failed before this entry with "the wasm*-unknown-
# unknown targets are not supported by default". Declaring the SAME
# `getrandom` version here with `js` turned on, scoped to
# `cfg(target_arch = "wasm32")` only, unifies (Cargo resolves one feature set
# per dependency version across the whole build graph) so the wasm build gets
# a real browser-CSPRNG-backed `getrandom` while every native build (the CLI,
# `pillar-streamdb`, tests) is completely untouched — this target table simply
# does not exist outside a wasm32 build.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[lints]
workspace = true
