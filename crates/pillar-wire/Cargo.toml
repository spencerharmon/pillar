[package]
name = "pillar-wire"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The shared-substrate crate for every byte Pillar persists or transmits: the versioned PillarMessage envelope, its canonical (deterministic) CBOR codec, Cid derivation, and the convergent content-seal interface. Owns SignedSegment/Cid/HeadRecord/Visibility/ContentStore/IpfsBackend (moved down from pillar-streamdb). Depends only downward onto pillar-crypto/pillar-core/pillar-ipfs; pillar-streamdb, pillar-observability, and pillar-net depend on THIS crate, never the reverse."

[features]
# The durable IPFS-node-backed substrate (`NativeIpfsBackend`, CIDv1 wire
# codecs) that rides `pillar-ipfs` -> `libp2p`. Mirrors the same feature gate
# `pillar-streamdb` used to carry directly, now owned here since the store
# moved down. On by default for every native consumer; a wasm32 consumer
# (`pillar-observability` via `pillar-web-frontend`) depends with
# `default-features = false` to keep the libp2p closure out of its build.
default = ["ipfs"]
ipfs = ["dep:pillar-ipfs"]

[dependencies]
pillar-crypto = { path = "../pillar-crypto" }
pillar-core = { path = "../pillar-core" }
pillar-ipfs = { path = "../pillar-ipfs", optional = true }
sha2 = "0.10"
tracing = "0.1"
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true
