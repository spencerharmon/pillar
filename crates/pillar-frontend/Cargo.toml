# pillar-frontend — the Yew + WebAssembly portal foundation.
#
# This crate is DELIBERATELY EXCLUDED from the root cargo workspace (see the
# root `Cargo.toml` `[workspace] exclude`): it targets `wasm32-unknown-unknown`
# and carries its own dependency closure (yew, stylist, wasm-bindgen) with its
# OWN `Cargo.lock`, so the native `pillar` binary build never pulls the wasm
# toolchain surface into its lockfile. The static asset bundle (wasm/js/css)
# `trunk` produces from this crate is what the two-stage nix build embeds into
# the one `pillar` binary via `include_bytes!` — there is NO npm/Node anywhere.
[package]
name = "pillar-frontend"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "pillar web portal — Yew + WebAssembly single-page foundation"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Opt-in acceptance gate for the `browser-pillar-client` definition-of-done:
# the host-native `tests/browser_pillar_client.rs` suite proving the Yew
# console emits the SAME signed, cell-sealed `pillar_ops::ResourceOp`
# envelope the CLI (`pillar_client::transport::seal_resource_op`) emits —
# byte-for-byte — and that the migrated resource-mutation acts translate to
# real `ResourceOp`s rather than privileged `/portal/resource/*` REST calls.
# Off by default so a plain `cargo test` stays fast; the DoD invokes
# `cargo test -p pillar-frontend --features acceptance` explicitly. The suite
# is host-native (this crate's `start()` entrypoint is `wasm32`-gated, so the
# rlib/tests compile and run on the host with no wasm runner or browser).
acceptance = []

[dependencies]
# Yew is the portal framework (operator-chosen) — needed here only for
# `yew::Renderer` at the wasm entrypoint below.
yew = { version = "0.21", features = ["csr"] }
# wasm-bindgen is pinned EXACTLY to the version the flake's nixpkgs ships as
# `wasm-bindgen-cli` (0.2.121): trunk runs that CLI over this crate's wasm and
# refuses a version mismatch, so the two MUST agree for the offline nix build.
wasm-bindgen = "=0.2.121"
# The portal's design system + app shell (auth session, router, panels) —
# this crate's job is only to mount `pillar_web_frontend::router::Shell` to
# the wasm entrypoint; every panel/route/component lives in that crate so it
# stays host-testable there (see that crate's docs).
pillar-web-frontend = { path = "../pillar-web-frontend" }

# This crate's own dependency closure pulls in `pillar-observability` ->
# `pillar-streamdb` -> `pillar-ipfs` -> `libp2p` -> `libp2p-yamux` -> `yamux`
# -> `rand` v0.9 -> `getrandom` v0.3, which does NOT support
# `wasm32-unknown-unknown` unless its `wasm_js` backend is explicitly enabled
# (see https://docs.rs/getrandom/0.3.4/#webassembly-support). Enabling the
# feature alone is insufficient — the wasm32 build ALSO needs the
# `--cfg getrandom_backend="wasm_js"` rustc flag, set in this crate's
# `.cargo/config.toml`. That cargo config is directory-scoped to this crate's
# subtree, so the flag applies only when the wasm bundle is built from here and
# never reaches the native `pillar`/`pillar-ipfs`/`libp2p` build (which targets
# the host, not wasm32). This crate is now a workspace member (so its host DoD
# is `-p`-addressable), but the flag stays crate-scoped and the target table
# below exists only in a wasm32 build.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

# Host-only acceptance-test deps (native target). `pillar-client` is the CLI's
# real native client library (tokio/quinn/rustls); the acceptance suite uses
# its `transport::seal_resource_op` as the ORACLE and asserts the browser
# client's wasm-safe seal/sign produces byte-identical envelopes. These are
# dev-only, so they never enter the wasm bundle's dependency closure.
[dev-dependencies]
pillar-web-frontend = { path = "../pillar-web-frontend" }
pillar-client = { path = "../pillar-client" }
pillar-ops = { path = "../pillar-ops" }
pillar-crypto = { path = "../pillar-crypto" }
pillar-wire = { path = "../pillar-wire", default-features = false }
pillar-manifest = { path = "../pillar-manifest" }
