[package]
name = "pillar-e2e"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Acceptance-tier end-to-end tests for the P0 \"workload reckoning\" feature tier: real sockets, real processes, real peers, real libp2p — never a model or in-memory stand-in. Every test here matches the acceptance-e2e CHECKS.md stub and runs only under --features acceptance."
publish = false

[dependencies]

[dev-dependencies]
pillar-controller = { path = "../pillar-controller" }
pillar-core = { path = "../pillar-core" }
pillar-coordination = { path = "../pillar-coordination" }
pillar-crypto = { path = "../pillar-crypto" }
pillar-identity = { path = "../pillar-identity" }
pillar-ipam = { path = "../pillar-ipam" }
pillar-manifest = { path = "../pillar-manifest" }
pillar-net = { path = "../pillar-net" }
pillar-cli = { path = "../pillar-cli" }
pillar-web = { path = "../pillar-web" }
pillar-observability = { path = "../pillar-observability" }
pillar-surface-inventory = { path = "../pillar-surface-inventory" }
pillar-streamdb = { path = "../pillar-streamdb" }
pillar-topology = { path = "../pillar-topology" }
libp2p = { version = "0.56", features = [
    "noise",
    "yamux",
    "tcp",
    "quic",
    "tokio",
    "macros",
    "request-response",
    "cbor",
] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
tempfile = "3"

[features]
# Gates every acceptance test in this crate. Off by default so a plain
# `cargo test` (unit-test tier) never pulls in the real-socket/real-swarm
# harnesses; the acceptance-e2e CHECKS.md stub always invokes
# `--features acceptance` explicitly.
acceptance = []

[lints]
workspace = true
