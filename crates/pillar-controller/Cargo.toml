[package]
name = "pillar-controller"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Reconciling controller: runs a declared OCI workload on a peer under an authorized subkey, gated by the coordination lease and the stream's view policy, with the image pulled over the libp2p blob substrate. The vertical slice tying substrate -> coordination -> view -> controller -> workload."

[dependencies]
pillar-core = { path = "../pillar-core" }
pillar-identity = { path = "../pillar-identity" }
pillar-coordination = { path = "../pillar-coordination" }
pillar-streamdb = { path = "../pillar-streamdb" }
pillar-crypto = { path = "../pillar-crypto" }
pillar-net = { path = "../pillar-net" }
# The Deployment kind (`crate::deployment`) places N replicas across N
# distinct failure domains via the real topology-spread placement decision —
# never a re-derived/in-crate spread heuristic.
pillar-topology = { path = "../pillar-topology" }
# The OCI runtime layer (`crate::runtime`) supervises the workload's
# digest-verified image as a REAL child process (spawn/stop/restart/health),
# replacing the modeled `Running` state value with a live `tokio::process`
# child bound to a real pid.
tokio = { version = "1", features = ["process", "rt", "rt-multi-thread", "macros", "time", "io-util"] }
tempfile = "3"

[dev-dependencies]
# The integration test drives the REAL libp2p blob request/response substrate
# (crates/pillar-net::blob) to pull the workload image by digest, so the
# vertical proof exercises the actual transport, not a stub.
libp2p = { version = "0.56", features = [
    "noise",
    "yamux",
    "tcp",
    "quic",
    "tokio",
    "macros",
    "request-response",
    "cbor",
] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"

[lints]
workspace = true
