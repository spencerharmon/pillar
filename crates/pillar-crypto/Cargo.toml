[package]
name = "pillar-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Factored cryptographic operations for pillar: password KDF, AEAD private-key encryption, signatures, public-key recipient sealing (node + cell), content-addressing multihash, and node-key custody backends (unencrypted / password / TPM / passkey). The interface is algorithm-agnostic; every operation currently returns CryptoError::NotImplemented and is pinned by the crate's contract tests."

[dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", default-features = false, features = ["rand_core"] }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
sha2 = "0.10"
hkdf = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }

[lints]
workspace = true
