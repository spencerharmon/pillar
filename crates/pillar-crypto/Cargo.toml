[package]
name = "pillar-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Factored cryptographic operations for pillar: password KDF, AEAD private-key encryption, signatures, public-key recipient sealing (node + cell), content-addressing multihash, and node-key custody backends (unencrypted / password / TPM / passkey). The interface is algorithm-agnostic; every operation is implemented and pinned by the crate's contract tests."

[dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", default-features = false, features = ["rand_core"] }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
sha2 = "0.10"
hkdf = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }

serde = { version = "1", optional = true, default-features = false, features = ["derive"] }

tss-esapi = { version = "7.5", optional = true }
cryptoki = { version = "0.7", optional = true }
ctap-hid-fido2 = { version = "3", optional = true }

[features]
# HSM/hardware node-custody backends are OPT-IN so the common build
# (`cargo test --all`, `cargo test -p pillar-crypto`, local dev) skips the
# bindgen crates (tss-esapi-sys, cryptoki-sys), their libclang build-time
# requirement, and the native libraries (tpm2-tss, hidapi) — ~100 extra build
# units. The DEPLOYED node turns them all on: the flake builds
# `-p pillar-cli --features hsm`, so every shipped node still carries every
# popular HSM backend (see crates/pillar-cli). Custody structs, the `Custody`
# enum, `CustodyKind`, and every fail-closed misconfiguration guard remain
# compiled unconditionally; only the on-device call path is behind a feature,
# and a backend whose feature is off fails closed with `CryptoError::Backend`.
default = []
# Derive serde Serialize/Deserialize for the surface-version stamp so a serde-
# serialized surface (event envelope, pillar-net messages) can carry it. Kept
# opt-in so the crate's core has no serde dependency.
serde = ["dep:serde"]
# TPM 2.0 sealed-object custody via tss-esapi / tpm2-tss.
tpm = ["dep:tss-esapi"]
# FIDO2 / WebAuthn-PRF (hmac-secret) custody via ctap-hid-fido2.
passkey = ["dep:ctap-hid-fido2"]
# PKCS#11 HSM / smart-card custody via cryptoki.
pkcs11 = ["dep:cryptoki"]
# Every popular hardware backend at once (what the deployed node builds).
hsm = ["tpm", "passkey", "pkcs11"]

[lints]
workspace = true
