[package]
name = "pillar-web-api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Shared DTO crate for the pillar web portal: every request/response type crossing the client/server boundary (login, bootstrap, WebAuthn ceremony payloads, session, observability query results, trust/RBAC views), compiled into both the Rust server (pillar-cli) and the Rust/WASM client (pillar-frontend) so the two sides cannot drift."

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
