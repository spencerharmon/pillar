[package]
name = "pillar-bootstrap"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Shared bootstrap library: cell/user/node onboarding sequence, name-uniqueness, bootstrap requests, and login-token issuance, reused by pillar-web and pillar-cli."

[dependencies]
pillar-crypto = { path = "../pillar-crypto" }
pillar-core = { path = "../pillar-core" }
pillar-identity = { path = "../pillar-identity" }
pillar-wot-authority = { path = "../pillar-wot-authority" }
pillar-rbac = { path = "../pillar-rbac" }
pillar-manifest = { path = "../pillar-manifest" }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"

[dev-dependencies]
pillar-observability = { path = "../pillar-observability" }

[lints]
workspace = true
