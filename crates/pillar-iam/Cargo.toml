[package]
name = "pillar-iam"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Pillar IAM: the user record (handle, display name, email, status, roles, groups, force_password_change, password_changed_at, timestamps) rebuilt by replaying signed, journaled PortalOps — subsumes the legacy members map. Ships GET/PUT /portal/profile logic and the admin invite/list/show surface, gated by the iam:users:write capability."

[dependencies]
pillar-core = { path = "../pillar-core" }
pillar-crypto = { path = "../pillar-crypto" }
# The shared Document surface (keyed-store / sql-views plane). The user record
# is migrated onto this ONE fold primitive instead of a bespoke hand-rolled
# fold, and is browsable as an ordinary Document collection.
pillar-keyedstore = { path = "../pillar-keyedstore" }
pillar-identity = { path = "../pillar-identity" }
pillar-rbac = { path = "../pillar-rbac" }
pillar-web = { path = "../pillar-web" }
pillar-wot-authority = { path = "../pillar-wot-authority" }
serde = { version = "1", features = ["derive"] }
# The migrated Document consumer serializes a `UserRecord` as one opaque
# Document scalar; the shared keyed-store surface stores it verbatim.
serde_json = "1"
rand_core = { version = "0.6", features = ["getrandom"] }

[dev-dependencies]
ciborium = "0.2"

[lints]
workspace = true
