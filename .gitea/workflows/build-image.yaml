# build-image — Gitea Actions workflow that builds the `pillar` container image
# from the repo-root `flake.nix` (nix `dockerTools.streamLayeredImage`, packaging
# the `pillar node run` entrypoint — see crates/pillar-cli/src/run.rs) and
# publishes it to the in-cluster Gitea OCI registry.
#
# SUPERSEDES the former Dockerfile-based build. There is NO Dockerfile: the job
# runs inside a **nixery build image** (`nixery.dev/shell/nix/skopeo`, which
# provides a shell plus `nix` and `skopeo`) and runs `nix build .#pillar-oci-image`
# to generate the OCI image, then pushes it with `skopeo`.
#
# The flake output is INFRA-AGNOSTIC (no registry/host/credential baked in), so
# the SAME `nix build` runs in GitHub Actions (pillar is public) and here in
# Gitea Actions. The registry target + push credentials come from CI config /
# Actions secrets, never hardcoded in the image. The push to the private Gitea
# OCI registry happens on THIS (Gitea Actions) side, where the creds live.
#
# PREREQUISITES:
#   - A registered act_runner advertising the `ubuntu-latest` label, able to run
#     the `nixery.dev/shell/nix/skopeo/git` job container (nixery pulls the image on
#     first use — see the top-level INFRASTRUCTURE.md "nixery" section). `git` is
#     added to the nixery image path because `actions/checkout@v4` requires a
#     node.js runtime that the plain nix/skopeo shell image does not provide (it
#     failed with `exec: "node": executable file not found`); checkout is done
#     with a plain `git clone` instead (see the "Checkout pillar" step).
#   - Actions secrets REGISTRY_USER / REGISTRY_PASSWORD on THIS repo, holding the
#     `write:package` Gitea credential for `git.spencerharmon.com/images/pillar`.
name: build-image

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - .gitea/workflows/build-image.yaml
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
  schedule:
    # Weekly, so the pinned nixpkgs base picks up rebuilds even absent a source
    # change.
    - cron: "0 5 * * 1"

env:
  REGISTRY: git.spencerharmon.com
  IMAGE: images/pillar

jobs:
  build-publish:
    runs-on: ubuntu-latest
    container:
      image: nixery.dev/shell/nix/skopeo/git
    steps:
      - name: Checkout pillar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # actions/checkout@v4 requires a node.js runtime the plain nix/skopeo
          # shell image doesn't provide, so check out with a bare git clone
          # instead (git is pulled in via the nixery image path above).
          # GITHUB_SERVER_URL already carries its own scheme (in-cluster Actions
          # runs see the internal http:// gitea-http service URL, not the
          # public https:// ingress host) — use it as-is, never re-prefix it.
          git -c http.extraHeader="Authorization: Bearer ${GITHUB_TOKEN}" \
            clone --no-checkout "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" .
          git checkout --detach "${GITHUB_SHA}"

      - name: Enable nix flakes
        run: |
          set -euo pipefail
          mkdir -p ~/.config/nix
          {
            echo "experimental-features = nix-command flakes"
            # The job container runs as root with no nixbld user/group
            # provisioned (single-container CI, not a real nix multi-user
            # install), so the default multi-user sandboxed build fails with
            # "the group 'nixbld' specified in 'build-users-group' does not
            # exist". Disable the build-users-group so nix builds directly
            # as the current (root) user instead of trying to sandbox to
            # nixbld1..N.
            echo "build-users-group ="
          } > ~/.config/nix/nix.conf

      - name: Compute image tag
        id: tag
        run: |
          set -euo pipefail
          echo "tag=$(echo "${GITHUB_SHA}" | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Build OCI image from flake
        run: |
          set -euo pipefail
          # streamLayeredImage produces `result`, an executable that streams the
          # image tar to stdout. Materialize it to a tarball skopeo can copy.
          nix build .#pillar-oci-image
          ./result > pillar-image.tar

      - name: Log in and push to Gitea OCI registry
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$REGISTRY_USER" || { echo "Actions secret REGISTRY_USER is not set"; exit 1; }
          test -n "$REGISTRY_PASSWORD" || { echo "Actions secret REGISTRY_PASSWORD is not set"; exit 1; }
          # skopeo requires a container trust policy file; this build image has
          # none provisioned by default ("no policy.json file found"). Accept
          # anything — the registry destination + creds are what actually gate
          # the push, this policy only controls skopeo's own local signature
          # verification (irrelevant for a same-host build->push).
          mkdir -p /etc/containers
          echo '{"default":[{"type":"insecureAcceptAnything"}]}' > /etc/containers/policy.json
          tag="${{ steps.tag.outputs.tag }}"
          dest_sha="docker://${REGISTRY}/${IMAGE}:${tag}"
          dest_latest="docker://${REGISTRY}/${IMAGE}:latest"
          # Push both the sha tag and `latest` from the single built tarball.
          skopeo copy \
            --dest-creds "${REGISTRY_USER}:${REGISTRY_PASSWORD}" \
            docker-archive:pillar-image.tar "$dest_sha"
          skopeo copy \
            --dest-creds "${REGISTRY_USER}:${REGISTRY_PASSWORD}" \
            docker-archive:pillar-image.tar "$dest_latest"

      - name: Resolve registry-served digest
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          digest="$(skopeo inspect \
            --creds "${REGISTRY_USER}:${REGISTRY_PASSWORD}" \
            --format '{{.Digest}}' \
            "docker://${REGISTRY}/${IMAGE}:${tag}")"
          echo "Published ${REGISTRY}/${IMAGE}:${tag} (and :latest) @ ${digest}"
