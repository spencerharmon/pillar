# pillar-integration — the VISIBLE Gitea Actions integration workflow.
#
# *** CURRENTLY NON-FUNCTIONAL — DOES NOT TRIGGER (2026-09-05) ***
# Gitea Actions only evaluates a `.gitea/workflows/*.yml` file for a repo that
# Gitea itself HOSTS. `pillar` is confirmed ABSENT from git.spencerharmon.com
# under any owner (verified via the Gitea API this pass: 404 on
# repos/spencerharmon/pillar, repos/spencer/pillar, and their actions/tasks
# endpoints; empty repo listings for both users) — GitHub remains this repo's
# sole home. So this file, though syntactically valid and merged, NEVER runs:
# there is no Gitea-hosted `pillar` for any push/PR/dispatch event to reach.
# Two remediations exist and BOTH terminate at an operator decision (see
# `pillar-gitea-actions-workflow-location-fix` in PLAN.md / its change doc for
# the full evidence and exact API queries):
#   (a) mirror `pillar` into Gitea — contradicts the operator's recorded
#       2026-07-22 "no public-repo mirroring to gitea, GitHub is sole source of
#       truth" decision (flux PLAN.md `zuul-github-readonly-image-source`).
#   (b) move this workflow into the consolidation `actions` repo — requires
#       adding that repo as a tracked hive submodule, itself an
#       operator/hive-layer decision flagged elsewhere.
# Do NOT treat this file's presence as evidence the integration harness is
# wired into a visible Gitea Actions run; it is not, until the operator picks
# (a) or (b) above.
#
# ROI "pillar-integration" (operator-directed, 2026-08-31): give the operator a
# workflow they can WATCH in pillar's own Gitea Actions view that stands up the
# real, multi-node black-box integration harness against the real published
# container image and runs its scenarios end-to-end. The consolidation
# `actions` repo the ROI names is not (yet) a tracked hive submodule, so per the
# ROI's own fallback the workflow is authored HERE, in pillar's own
# `.gitea/workflows/pillar-integration.yml`, on the self-hosted runner. A later
# task migrates it to the central actions repo if/when the operator adds it.
#
# Why Gitea Actions (self-hosted) and NOT GitHub: the integration harness boots
# a privileged, nested-container / containerlab topology (tc/netem impairment),
# which needs the self-hosted runner's `dind` sidecar (`privileged: true`,
# NET_ADMIN) — GitHub's hosted runners cannot provide that, and integration/rig
# testing is Gitea-only by policy. This file carries NO infrastructure
# identifiers (host, IP, cluster/service name, secret name): it targets the
# runner purely by its capability label, and the harness reads the real image
# reference from its own defaults.
#
# runs-on: pillar-integration — the dedicated capability label the in-cluster
# act_runner advertises (backed by the ghcr catthehacker ubuntu:act-latest
# image + a privileged dind sidecar). Additive to the runner's ubuntu-latest/k8s
# labels; only jobs that ask for `pillar-integration` land on the harness-capable
# runner.
name: pillar-integration

on:
  # The operator can dispatch a run by hand from the Gitea Actions view.
  workflow_dispatch: {}
  # Every push to main and every PR runs the harness so a regression in the
  # integration surface is caught in the visible Actions view.
  push:
    branches: [main]
  pull_request:

# No repo-write effects: the harness only observes external surfaces. Keep the
# token read-only.
permissions:
  contents: read

jobs:
  smoke:
    name: integration harness (smoke scenario)
    # Land on the harness-capable self-hosted runner (privileged dind sidecar
    # for the nested-container / containerlab topology). Never GitHub-hosted.
    runs-on: pillar-integration
    steps:
      - name: Checkout pillar
        uses: actions/checkout@v4

      - name: Resolve a container runtime
        id: runtime
        run: |
          set -euo pipefail
          # The harness drives a real OCI runtime (podman preferred; docker via
          # the privileged dind sidecar otherwise). Prove one is usable BEFORE
          # the scenario so a missing runtime fails loudly and early rather than
          # deep inside topology boot.
          if command -v podman >/dev/null 2>&1; then
            echo "runtime=podman" >> "$GITHUB_OUTPUT"
            podman version || true
          elif command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            echo "runtime=docker" >> "$GITHUB_OUTPUT"
            docker version || true
          else
            echo "FAIL: no usable container runtime (podman or working docker) on the runner" >&2
            exit 1
          fi

      - name: Run the smoke scenario against the real image
        env:
          # Let the harness pick podman/docker per what this runner exposes.
          PILLAR_IT_RUNTIME: ${{ steps.runtime.outputs.runtime }}
        run: |
          set -euo pipefail
          chmod +x scripts/pillar-integration/run-scenario.sh
          # `smoke` is the harness's own definition-of-done: a >=3-node real-image
          # topology, one manifest applied through the CLI driver, one real-effect
          # oracle (process oracle: a real pid + a real bound socket on every
          # node), idempotent teardown, and a clean leak detector.
          ./scripts/pillar-integration/run-scenario.sh smoke

  # The full scenario suite runs ONLY on main / manual dispatch and never blocks
  # a PR — it is heavier (every scenario family the harness ships), but the
  # operator still sees each scenario's pass/fail in the Actions view. It is
  # additive: if only `smoke` exists today it is a no-op beyond smoke, and new
  # scenario families are picked up automatically as they land under
  # scripts/pillar-integration/scenarios/.
  scenarios:
    name: integration harness (full scenario suite)
    if: ${{ github.event_name != 'pull_request' }}
    needs: smoke
    runs-on: pillar-integration
    steps:
      - name: Checkout pillar
        uses: actions/checkout@v4

      - name: Resolve a container runtime
        id: runtime
        run: |
          set -euo pipefail
          if command -v podman >/dev/null 2>&1; then
            echo "runtime=podman" >> "$GITHUB_OUTPUT"
          elif command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            echo "runtime=docker" >> "$GITHUB_OUTPUT"
          else
            echo "FAIL: no usable container runtime on the runner" >&2
            exit 1
          fi

      - name: Run every scenario the harness ships
        env:
          PILLAR_IT_RUNTIME: ${{ steps.runtime.outputs.runtime }}
        run: |
          set -euo pipefail
          chmod +x scripts/pillar-integration/run-scenario.sh
          # Discover every scenario file the harness defines and run each one.
          # `smoke` already ran in the gating job above; run the rest here so a
          # heavier scenario failure is visible without re-gating the PR.
          shopt -s nullglob
          rc=0
          for f in scripts/pillar-integration/scenarios/*.sh; do
            name="$(basename "$f" .sh)"
            [ "$name" = "smoke" ] && continue
            echo "::group::scenario ${name}"
            if ./scripts/pillar-integration/run-scenario.sh "$name"; then
              echo "scenario ${name}: PASS"
            else
              echo "scenario ${name}: FAIL" >&2
              rc=1
            fi
            echo "::endgroup::"
          done
          if [ "$rc" -ne 0 ]; then
            echo "FAIL: one or more integration scenarios failed" >&2
            exit "$rc"
          fi
          echo "OK: all integration scenarios passed"
