[workspace]
resolver = "2"
members = [
    "crates/pillar-core",
    "crates/pillar-crypto",
    "crates/pillar-controller",
    "crates/pillar-eventlog",
    "crates/pillar-coordination",
    "crates/pillar-ipam",
    "crates/pillar-manifest",
    "crates/pillar-identity",
    "crates/pillar-net",
    "crates/pillar-streamdb",
    "crates/pillar-observability",
    "crates/pillar-wot-authority",
    "crates/pillar-rbac",
    "crates/pillar-bootstrap",
    "crates/pillar-key-distribution",
    "crates/pillar-cells",
    "crates/pillar-recovery",
    "crates/pillar-cli",
    "crates/pillar-web",
    "crates/pillar-trust-artifacts",
    "crates/pillar-quota-ledger",
    "crates/pillar-topology",
    "crates/pillar-upgrade-gate",
]
# pillar-frontend targets wasm32-unknown-unknown and carries the yew/stylist/
# wasm-bindgen closure with its OWN Cargo.lock; excluding it keeps the wasm
# toolchain surface out of the native `pillar` binary's lockfile and build.
exclude = [
    "crates/pillar-frontend",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/spencerharmon/pillar"
rust-version = "1.80"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
