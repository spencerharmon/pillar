[workspace]
resolver = "2"
members = [
    "crates/pillar-core",
    "crates/pillar-controller",
    "crates/pillar-eventlog",
    "crates/pillar-coordination",
    "crates/pillar-ipam",
    "crates/pillar-manifest",
    "crates/pillar-identity",
    "crates/pillar-net",
    "crates/pillar-streamdb",
    "crates/pillar-observability",
    "crates/pillar-wot-authority",
    "crates/pillar-rbac",
    "crates/pillar-bootstrap",
    "crates/pillar-key-distribution",
    "crates/pillar-cells",
    "crates/pillar-recovery",
    "crates/pillar-cli",
    "crates/pillar-web",
    "crates/pillar-trust-artifacts",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/spencerharmon/pillar"
rust-version = "1.80"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
