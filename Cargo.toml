[workspace]
resolver = "2"
members = [
    "crates/pillar-core",
    "crates/pillar-crypto",
    "crates/pillar-controller",
    "crates/pillar-eventlog",
    "crates/pillar-coordination",
    "crates/pillar-ipam",
    "crates/pillar-manifest",
    "crates/pillar-identity",
    "crates/pillar-iam",
    "crates/pillar-net",
    "crates/pillar-wire",
    "crates/pillar-streamdb",
    "crates/pillar-ipfs",
    "crates/pillar-swarm",
    "crates/pillar-observability",
    "crates/pillar-wot-authority",
    "crates/pillar-rbac",
    "crates/pillar-bootstrap",
    "crates/pillar-key-distribution",
    "crates/pillar-cells",
    "crates/pillar-recovery",
    "crates/pillar-cli",
    "crates/pillar-client",
    "crates/pillar-ops",
    "crates/pillar-web",
    "crates/pillar-web-frontend",
    "crates/pillar-web-api",
    "crates/pillar-trust-artifacts",
    "crates/pillar-quota-ledger",
    "crates/pillar-topology",
    "crates/pillar-upgrade-gate",
    "crates/pillar-realness-gate",
    "crates/pillar-surface-inventory",
    "crates/pillar-e2e",
    "crates/pillar-blob-provider",
    "crates/pillar-integration-coverage",
    # pillar-frontend is the wasm entrypoint crate (yew Renderer). It is a
    # workspace member so its host-native DoD (`cargo test -p pillar-frontend
    # --features acceptance`, the browser-pillar-client acceptance gate)
    # resolves from the repo root. Its `start()` entrypoint is
    # `#[cfg(target_arch = "wasm32")]`-gated, so on the native host the crate is
    # an ordinary rlib that compiles and tests cleanly; the wasm *bundle* is
    # still built by the flake's `trunk` stage. The root Cargo.lock already
    # resolves this crate's whole closure (yew 0.21, wasm-bindgen 0.2.121,
    # gloo-net, stylist) at the exact versions its former standalone lock
    # pinned — via the sibling `pillar-web-frontend` member — so sharing the one
    # workspace lockfile changes no resolved version.
    "crates/pillar-frontend",
]
# (No crate is excluded: pillar-frontend joined the workspace above so its
# host-native acceptance test is `-p`-addressable from the root.)

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/spencerharmon/pillar"
rust-version = "1.80"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
