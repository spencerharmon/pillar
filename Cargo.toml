[workspace]
resolver = "2"
members = [
    "crates/pillar-core",
    "crates/pillar-coordination",
    "crates/pillar-identity",
    "crates/pillar-streamdb",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/spencerharmon/pillar"
rust-version = "1.80"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
