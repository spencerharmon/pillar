name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # fmt + clippy + test all run through the flake devShell (`nix develop`), so
  # they share ONE reproducible toolchain pinned by flake.lock (rustfmt / clippy
  # / cargo from nixpkgs) and get the native libraries the hardware custody
  # backends link — tpm2-tss (tss-esapi), hidapi + libusb1 (ctap-hid-fido2), and
  # libclang for the bindgen build scripts (tss-esapi-sys, cryptoki-sys). A bare
  # nixery `shell` image only ships a package's runtime output, so its headers /
  # .pc files / libclang would be missing; the devShell (mkShell) exposes the
  # `.dev` outputs correctly.
  rust:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    container:
      image: nixery.dev/shell/nix/git/bash/coreutils
    env:
      # The nixery shell image has no /etc/passwd entry or writable /root for
      # the runner uid; point HOME at a dir Actions provisions writable.
      HOME: /github/home
    steps:
      - name: Checkout pillar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          # actions/checkout needs a node runtime this image lacks; bare-clone
          # instead. github's git-over-HTTP wants the token as the basic-auth
          # password, so embed it as x-access-token in the URL.
          git config --global --add safe.directory "$(pwd)"
          server="${GITHUB_SERVER_URL#https://}"
          git clone --no-checkout "https://x-access-token:${GITHUB_TOKEN}@${server}/${GITHUB_REPOSITORY}.git" .
          git checkout --detach "${GITHUB_SHA}"

      - name: Enable nix flakes
        run: |
          set -euo pipefail
          mkdir -p ~/.config/nix
          # Flakes on; disable build-users-group since this single-container CI
          # has no nixbld users provisioned (same as the image-build workflow).
          printf 'experimental-features = nix-command flakes\nbuild-users-group =\n' > ~/.config/nix/nix.conf
          # nix's home/user resolution consults getpwuid; the image has no
          # passwd entry for the runner uid, so add one.
          if ! getent passwd "$(id -u)" >/dev/null 2>&1; then
            echo "root:x:0:0:root:${HOME}:/bin/sh" >> /etc/passwd
          fi

      - name: rustfmt
        run: nix develop -c bash -c 'cargo fmt --all -- --check'

      - name: clippy
        run: nix develop -c bash -c 'cargo clippy --workspace --all-targets --all-features -- -D warnings'

      - name: test
        run: nix develop -c bash -c 'cargo test --all'

  tlc:
    name: TLA+ model check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Model-check all specs
        run: ./check.sh
        working-directory: specs
