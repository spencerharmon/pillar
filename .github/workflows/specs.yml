name: specs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tlc:
    name: TLA+ model check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Model-check all specs
        run: ./check.sh
        working-directory: specs
