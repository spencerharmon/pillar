\* Model-check configuration for GlobalIdentity.
\* Small finite instance: up to 3 primary rotations (genesis + 3 generations),
\* 2 domains (to exercise per-domain one-hop certification, compromise
\* isolation, and independent per-domain revocation), and 2 nodes a subkey
\* offer may be sealed to. GID is the stable global CID that never changes
\* across rotations. Enough to exercise: rotate the primary while the CID
\* stays fixed; certify exactly one subkey per domain by different primary
\* generations; enroll one domain pairwise (domain-local alias) and leave the
\* other default-correlatable; seal a per-domain subkey offer to a node; and
\* revoke one domain without disturbing the other or the primary.
CONSTANTS
    Domains = {dA, dB}
    Nodes = {n1, n2}
    MaxGen = 3
    GID = gid
    None = None
SPECIFICATION Spec
INVARIANTS
    TypeOK
    RotationPreservesIdentifier
    NoUnauthorizedPrimary
    PerDomainSubkeyOneHop
    CompromiseIsolation
    PerDomainRevocationFailClosed
    PrimarySecretNeverEscrowed
    PairwiseUnlinkable
