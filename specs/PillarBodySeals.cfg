\* Model-check configuration for PillarBodySeals.
\* Small finite instance exercising every body treatment non-vacuously:
\*   - three agents: a1 holds cell cA's key, a2 holds cell cB's key AND principal
\*     pn's key, a3 holds NOTHING (the no-key liveness/confidentiality witness);
\*   - two cells cA, cB so a cA-sealed body cannot be opened by a2/a3;
\*   - two principals pu, pn: pn's key is held by a2 (a recipient CAN open its
\*     direct message), pu's key is held by NOBODY (an external user -- no cell
\*     agent ever opens it, so RcptOpaqueToNonHolder is non-vacuous);
\*   - one content m1 with two entropy draws e1, e2 so the RANDOM recipient seal
\*     has same-content/different-draw pairs (RcptRandomDistinctByEntropy) while
\*     keeping the opened-set state space tiny.
CONSTANTS
    a1 = a1
    a2 = a2
    a3 = a3
    cA = cA
    cB = cB
    pu = pu
    pn = pn
    Contents = {m1}
    Entropies = {e1, e2}
    holdersCA = {a1}
    holdersCB = {a2}
    holdersPU = {}
    holdersPN = {a2}
SPECIFICATION Spec
INVARIANTS
    TypeOK
    OneRecordFormat
    DedupByCid
    CellConfidential
    RcptOpaqueToNonHolder
PROPERTIES
    PlainReadableWithoutKey
