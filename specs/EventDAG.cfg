\* Model-check configuration for EventDAG.
\* Small finite instance: 2 authors, per-author chains bounded to length 2.
\* Enough to exercise genesis (seq 0) and a successor (seq 1) per author, a
\* cross-author parent edge (each author observing the other's tip), the
\* content-address dedup path (ReBroadcast), and the full happens-before order.
CONSTANTS
    Authors = {a1, a2}
    MaxSeq = 2
SPECIFICATION Spec
INVARIANTS
    TypeOK
    UniquePerAuthorSeq
    NoGaps
    PrevLinkIntegrity
    ParentsCrossAuthorAndExist
    CausalMonotone
