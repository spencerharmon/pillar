\* Model-check configuration for NamingAuthorityPlane.
\* Small finite instance: an owner-anchored root cell plus one further
\* candidate cell, one naming domain, one identity, and a role label --
\* enough to exercise a direct root->cell edge, a depth-exhausted (denied)
\* two-hop attempt, all three revocation kinds, Partition/Heal/StaleView
\* interleavings against Act's revoke-before-act freshness guard (as
\* WoTAuthority), plus every naming-plane action (AddToDomain/
\* RemoveFromDomain/Address) and RBAC action (AssignRole/RevokeRole)
\* interleaved against it. (A larger instance is a valid instance of the
\* same spec but grows the reachable state space quickly; this is the
\* largest instance kept exhaustively checkable in check.sh's CI budget.)
CONSTANTS
    Cells = {root, c1}
    Domains = {dom1}
    Identities = {u1}
    RootCell = root
    Roles = {viewer}
    MaxDepth = 0
    None = None
SPECIFICATION Spec
CONSTRAINT StateConstraint
INVARIANTS
    TypeOK
    FreshMarkBounded
    DomainSignsNothing
    RolesAreCellOrIdentityScoped
    AddressingDoesNotConferAuthority
    NoActionAfterRevocation
    FailClosedUnderStaleView
