\* Model-check configuration for LoginToken.
\* Small finite instance:
\*   - 2 users u1, u2 (exercise per-user token state + no cross-user reuse).
\*   - 2 domains d1, d2 (a token is bound to exactly one).
\*   - MaxClock = 2 bounds time so expiry/tick is exhaustible.
\*   - None = NONE sentinel for an unbound token.
\* Exercises: forward-credential -> mint(bound, future expiry) -> authenticate,
\* revoke (drops auth), and tick-to-expiry (drops auth, fail-closed).
CONSTANTS
    Users = {u1, u2}
    Domains = {d1, d2}
    MaxClock = 2
    None = NONE
SPECIFICATION Spec
INVARIANTS
    TypeOK
    AuthdImpliesLiveToken
    TokenBoundToItsUser
    MintedOnlyByForwardedCredential
    NoAuthAfterExpiryOrRevoke
