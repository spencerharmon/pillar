\* Model-check configuration for KeyDistribution.
\* Small finite instance: 2 candidate cells, 2 candidate nodes (one held
\* "foreign" -- owned by some other cell than our single modelled offering
\* user's own), 1 candidate user, 2 candidate artifacts (one cold-root-typed,
\* held forever un-escrowable) -- enough to exercise: L0/L2 auto re-sealing
\* across an allow-list add AND remove, L1 offer-without-accept and
\* accept-without-offer (neither admits), fail-closed offer revocation of an
\* already-admitted record, an all-own-cell-nodes offer admitting silently,
\* a cross-owner offer blocked until explicitly confirmed, the cold-root
\* artifact being refused at every escrow/offer/admit guard, and both a
\* legitimate (client-cooperated) and a server-compromised-but-uncooperated
\* escrow-recovery attempt.
CONSTANTS
    Cells = {c1, c2}
    Nodes = {n1, n2}
    Users = {u1}
    Artifacts = {a1, a2}
    RootArtifacts = {a2}
    ForeignNodes = {n2}
SPECIFICATION Spec
INVARIANTS
    TypeOK
    SealedMatchesAllowlist
    BiDirectionalConsent
    FailClosedRevocation
    CrossOwnerGate
    EscrowTypeBound
    NoRootEscrow
    OpaqueConfidentiality
