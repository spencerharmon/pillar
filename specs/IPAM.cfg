\* Model-check configuration for IPAM.
\* Small finite instance: 3 actors, a pool of addresses 0..3 (majority quorum
\* of any 2 of 3 actors is required to grant an address).
CONSTANTS
    Actors = {a1, a2, a3}
    MaxAddr = 3
    None = None
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoDoubleAllocation
    GrantsAreFenced
