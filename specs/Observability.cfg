\* Model-check configuration for Observability.
\* Small finite instance: a single peer (enough to exercise every action and
\* each of the 3 safety properties without the extra state a second node
\* would add to the composed WoTAuthority decider -- see WoTAuthority.cfg's
\* own note on keeping the composed authority state exhaustively checkable
\* in CI budget), 1 event id, 1 occurrence, retention window 1 tick, clock
\* bound 1, sample cap 1, tsig depth bound 0.
CONSTANTS
    Nodes = {owner}
    EventIds = {1}
    Occurrences = {o1}
    RetentionWindow = 1
    MaxTick = 1
    SampleCap = 1
    Owner = owner
    MaxDepth = 0
    None = None
SPECIFICATION Spec
INVARIANTS
    TypeOK
    LogSubsetOfWritten
    NoLossBeforeExpiry
    NoFabricatedSample
    NoDoubleCountSample
    ReadRequiresAuthority
    FailClosedReadUnderStaleView
    NoActionAfterRevocation
    FailClosedUnderStaleView
    FreshMarkBounded
