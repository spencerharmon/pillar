\* Model-check configuration for TrustArtifacts.
\* Small finite instance: an owner anchor plus one further candidate
\* identity, a single modelled role@scope capacity, a depth bound of 0 (a
\* directly-issued attest edge grants no further sub-delegation), an epoch
\* bound of 1 (enough for zero/one revocation), and a quota budget of 1
\* (enough to exercise "admit the whole budget" and "refuse to overrun
\* it"). This is the same tractability trade WoTAuthority's own .cfg makes
\* (it fixes MaxDepth = 0 as "the largest instance kept exhaustively
\* checkable" for a 2-node model): a combined-tuple model with MORE than
\* one non-trivial capacity value at this Nodes/Depth size did not finish
\* in several minutes while designing this spec, so the checked-in instance
\* fixes exactly one representative role capacity (`Role`/`Scope`), which
\* still exercises every branch of every proven property below: Certify,
\* Trust, a direct owner->subject role-grant attest (accepted) and a
\* self-capacity attest over another identity (rejected by construction --
\* AttestSelf requires a=s), a depth-exhausted two-hop attest attempt
\* (denied -- MaxDepth=0), RevokeGrant against a specific role-grant
\* artifact bumping revEpoch, Partition/Heal/SyncEpoch/SyncQuotaView
\* interleavings against Attest's fenced-epoch and fenced-quota guards, and
\* a quota admission racing a stale quotaView (refused).
CONSTANTS
    Nodes = {owner, n1}
    Owner = owner
    Role = r
    Scope = s1
    MaxDepth = 0
    MaxEpoch = 1
    Quota = 1
    None = None
SPECIFICATION Spec
INVARIANTS
    TypeOK
    FreshEpochBounded
    QuotaViewBounded
    VerificationTerminates
    CapacityHeldAtSigning
    RevocationHonorsEpoch
    QuotaNeverDoubleSpent
