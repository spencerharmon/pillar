\* Model-check configuration for PillarMessageFormat.
\* Small finite instance sufficient to exercise every invariant non-vacuously:
\*   - two single-node cells (CellA = {n1}, CellB = {n2}) so a cA-sealed record
\*     can be backfilled to a cB node that must NOT be able to open it
\*     (CellConfidential), while both nodes can hold the SAME record and agree on
\*     its Cid (ContentAddressStable / DedupUnderEncryption);
\*   - two distinct plaintext bodies (b1, b2) so NoNonceReuseAcrossDistinctPlaintext
\*     and the dedup collapse both have distinct AND identical cases to range over;
\*   - a compat window N = 1 and ceiling MaxV = 2 (two release/upgrade cycles),
\*     enough to reach a mixed-version state (RollingCoexistence) and every
\*     negotiation branch, while keeping the state space tiny.
CONSTANTS
    CellA = {n1}
    CellB = {n2}
    Bodies = {b1, b2}
    N = 1
    MaxV = 2
SPECIFICATION Spec
INVARIANTS
    TypeOK
    OneRecordFormat
    ContentAddressStable
    DedupUnderEncryption
    CellConfidential
    NegotiationRefusesIncompatible
PROPERTIES
    RollingCoexistence
