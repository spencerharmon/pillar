\* Model-check configuration for PillarMessageFormat -- unified Pillar Message
\* Format, method#1 step (a). Small finite instance kept exhaustively checkable
\* in CI budget: two nodes, two cells, two abstract bodies, two version surfaces
\* (envelope + pillar-UDP) with a MaxVersion=1 ceiling and an N=1 compat window
\* -- enough to exercise convergent seal + dedup, handshakeless transmit, and a
\* rolling mixed-version cutover with clean incompatible-refusal, for all eight
\* proven properties without combinatorial blow-up. MemberCells is fixed by the
\* spec's ModelMemberCells (one node holds a single cell; the other holds both)
\* so the cell confidentiality boundary has a genuine non-member.
CONSTANTS
    Nodes = {n1, n2}
    Cells = {cA, cB}
    Bodies = {b1, b2}
    MaxVersion = 1
    N = 1
    Envelope = Envelope
    PillarUDP = PillarUDP
    MemberCells <- ModelMemberCells
SPECIFICATION Spec
CONSTRAINT StateConstraint
INVARIANTS
    TypeOK
    OneRecordFormat
    ContentAddressStable
    DedupUnderEncryption
    CellConfidential
    HandshakelessAuth
    NoNonceReuseAcrossDistinctPlaintext
    NegotiationRefusesIncompatible
PROPERTIES
    RollingCoexistence
