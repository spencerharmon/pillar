\* Model-check configuration for BreakGlassRecovery.
\* Small finite instance: 2 subjects, 3 candidate admins with a real 2-of-3
\* quorum (M=2), and 2 abstract capabilities. Enough to exercise: key loss,
\* cap revocation (epoch advance), admin staleness/partition, a quorum
\* reaching (and failing to reach, with only 1 approver) the M threshold, key
\* rotation across a recovery, post-recovery containment before onboarding,
\* and CompleteOnboarding re-enabling authority.
CONSTANTS
    Subjects = {s1, s2}
    Admins = {a1, a2, a3}
    Caps = {c1, c2}
    M = 2
    MaxEpoch = 3
    MaxGen = 2
    None = None
SPECIFICATION Spec
INVARIANTS
    TypeOK
    FreshMarkBounded
    RecoveryNeedsQuorum
    SubThresholdNeverRecovers
    RecoveryRotatesAndRevokes
    RecoveryHonorsContainment
    RecoveryHonorsEpoch
