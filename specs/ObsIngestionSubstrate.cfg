\* Model-check configuration for ObsIngestionSubstrate.
\* Small finite instance kept exhaustively checkable in CI budget: a single
\* booting peer, the FIVE real signal kinds, one real occurrence, one label
\* set, one optional correlation id, and a 2-envelope store bound -- enough to
\* exercise boot-to-defaults, a config override on every kind, and the
\* end-to-end ingestion path (produce/no-fabricate) for each of the 4 proven
\* properties without combinatorial blow-up.
\*
\* DefaultOn encodes the declared default matrix directly: metrics, logs and
\* metadata boot ON; traces and profiles boot OFF -- every default
\* config/manifest-toggleable (ConfigToggle can flip any of the five).
CONSTANTS
    Nodes = {n1}
    Kinds = {metrics, logs, traces, profiles, metadata}
    DefaultOn = {metrics, logs, metadata}
    Occurrences = {o1}
    Labels = {lset}
    CorrIds = {c1}
    MaxEnvelopes = 2
    None = None
SPECIFICATION Spec
INVARIANTS
    TypeOK
    ProducerContractUniform
    DefaultsMatchSpec
    ConfigOverrideHonored
    NoFabricatedSample
