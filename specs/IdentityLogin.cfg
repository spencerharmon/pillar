\* Model-check configuration for IdentityLogin.
\* Small finite instance: 1 cold root, 2 candidate operational keys, 2
\* candidate device subkeys -- enough to exercise cold-root Certify, a
\* delegation-grant enrollment chain (op2 enrolled via op1 without ever
\* touching the root), a rogue/unenrolled op granting a device, self-
\* revocation of an op key and of a device without any root involvement,
\* and a login attempted both before and after each revocation.
CONSTANTS
    Roots = {r1}
    OpKeys = {o1, o2}
    Devices = {d1, d2}
    None = None
SPECIFICATION Spec
INVARIANTS
    TypeOK
    LoginRequiresValidChain
    NoAmbientAuthority
