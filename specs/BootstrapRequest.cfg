\* Model-check configuration for BootstrapRequest.
\* Small finite instance:
\*   - 2 requesters r1, r2 (enough to interleave a node join and a user join,
\*     and to exercise one approved + one rejected concurrently).
\*   - 2 existing authorized members m1, m2 that may approve/reject; the
\*     requesters are NOT members, so self-approval is structurally impossible.
\*   - None = NONE sentinel for "no approver yet".
\* Exercises: submit(node|user), approve (seal cell key to an approved node /
\* escrow an approved user's offer), reject (no key), and the terminal-state
\* guards (no double-decide leaking a second key).
CONSTANTS
    Requesters = {r1, r2}
    Members = {m1, m2}
    None = NONE
SPECIFICATION Spec
INVARIANTS
    TypeOK
    SealOnlyToApprovedNode
    EscrowOnlyForApprovedUser
    NoKeyWithoutAuthorizedApprover
    RejectedNeverGetsKey
