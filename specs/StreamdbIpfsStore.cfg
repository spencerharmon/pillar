\* Model-check configuration for StreamdbIpfsStore.
\* Small finite instance: 2 nodes on the private swarm, 2 segments (CIDs are
\* the identity of segments -- see Hash's definition in the module), 1 an
\* anchor and 1 a non-anchor op that must never reach the DHT, up to 2
\* concurrent partitions, IPNS sequence numbers 0..1. One owner is
\* public-visibility (its head MAY reach the DHT), the other is
\* cell-visibility (its head must never reach the DHT). Kept intentionally
\* tiny: the temporal (liveness) properties below make TLC build the full
\* behavior graph over the state space, which is far more expensive than the
\* safety-only BFS other specs in this suite run.
CONSTANTS
    Nodes = {n1, n2}
    Segments = {s1, s2}
    AnchorCids = {s1}
    PublicOwners = {n1}
    NumParts = 2
    MaxSeq = 1
    Nil = Nil
    None = None
SPECIFICATION Spec
INVARIANTS
    TypeOK
    ContentAddressCorrect
    HeadSignedByOwner
    AnchorsOnlyToDHT
PROPERTIES
    ObjectImmutable
    HeadSequenceMonotonic
    BackfillReconverges
