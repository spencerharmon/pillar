\* Model-check configuration for StreamdbIpfsStore.
\* Small finite instance kept deliberately tight so exhaustive TLC (including the
\* <>[] liveness BackfillReconverges) terminates quickly: 2 swarm nodes, 2
\* content objects of mixed visibility ({1} cell-encrypted (odd), {2} public
\* anchor (even)), 1 head owner, head sequence numbers 0..2, up to 2 concurrent
\* partitions. Objects are real Nats (their own content addresses) so the
\* injective-CID content-addressing proof is exercised, and the public/cell mix
\* exercises AnchorsOnlyToDHT.
CONSTANTS
    Nodes = {n1, n2}
    Objects = {1, 2}
    Owners = {w1}
    MaxSeq = 2
    NumParts = 2
SPECIFICATION Spec
INVARIANTS
    TypeOK
    ContentAddressCorrect
    HeadSignedByOwner
    AnchorsOnlyToDHT
    PinnedSubsetOfStore
    StoreSubsetOfWritten
PROPERTIES
    HeadSequenceMonotonic
    BackfillReconverges
