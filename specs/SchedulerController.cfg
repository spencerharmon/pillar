\* Model-check configuration for SchedulerController.
\* A small finite instance that still exercises every property:
\*   3 jobs, one per concurrency policy, and BOTH kinds present so
\*   OneEngineNoFork is a non-vacuous check that a workload CronJob and an
\*   observability RecordingRule/Alert evaluation share the one engine:
\*     j1 = workload,      Forbid,  requires broad tier t1
\*     j2 = observability, Replace, requires mid   tier t2
\*     j3 = workload,      Allow,   requires leaf  tier t3
\*   3 topology tiers t1<t2<t3 (the topology-label-hierarchy, broad->leaf).
\*   MaxBackoff = 2 bounds the retry budget; HistoryCap = 2 bounds retention;
\*   MaxRuns = 4 bounds the reachable state space.
\* The function-typed constants (Kind/Policy/ReqTier/TierRank) and the job/tier
\* sets are supplied by in-module MC* definitions (the .cfg format cannot carry
\* a function literal), overridden below.
CONSTANTS
    j1 = j1  j2 = j2  j3 = j3
    t1 = t1  t2 = t2  t3 = t3
    MaxBackoff = 2
    HistoryCap = 2
    MaxRuns = 4
CONSTANTS
    Jobs     <- MCJobs
    Tiers    <- MCTiers
    Kind     <- MCKind
    Policy   <- MCPolicy
    ReqTier  <- MCReqTier
    TierRank <- MCTierRank
SPECIFICATION Spec
INVARIANTS
    TypeOK
    OneEngineNoFork
    ConcurrencyPolicyHonored
    BackoffBounded
    RunHistoryBounded
    PlacementRespectsTopology
