\* Model-check configuration for Registration.
\* Small finite instance: 2 candidate user primaries, 2 candidate node
\* subkeys -- enough to exercise a registered primary, an unregistered
\* (rogue) primary, an unsigned subkey, and a subkey signed by an
\* unregistered primary.
CONSTANTS
    Users = {u1, u2}
    Subkeys = {k1, k2}
    None = None
SPECIFICATION Spec
INVARIANTS
    TypeOK
    AdmissionRequiresAuthorizedChain
    NoAmbientAuthority
