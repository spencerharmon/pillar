\* Model-check configuration for PillarUdpMesh.
\* Small finite instance: cell A at 2 sites, cell B at 2 sites -> a 2x2 = 4
\* link full mesh (enough for a non-trivial route-around: the adversary can
\* down any 3 of the 4 links and delivery must still complete over the 4th),
\* carrying a 2-message flow.
CONSTANTS
    SitesA = {a1, a2}
    SitesB = {b1, b2}
    Msgs = {m1, m2}
SPECIFICATION Spec
INVARIANTS
    TypeOK
    ExactlyOnce
PROPERTIES
    MeshCompletes
