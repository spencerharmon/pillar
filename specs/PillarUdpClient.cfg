\* Model-check configuration for PillarUdpClient.
\* Small finite instance: 3 dispersed ingest nodes (a non-trivial dispersion
\* topology: the adversary can knock out any subset of the three client->node
\* paths), redundancy allowance 2 (the client may spray at most 2 of the 3
\* nodes per round -- so no single round can cover the whole cell, forcing the
\* route-around to matter).
CONSTANTS
    Nodes = {n1, n2, n3}
    Allowance = 2
SPECIFICATION Spec
INVARIANTS
    TypeOK
    ExactlyOnce
    SprayWidthBounded
PROPERTIES
    Delivered
