\* Model-check configuration for StreamingDB.
\* Small finite instance: 3 nodes (majority quorum = any 2), 2 content addresses,
\* up to 2 concurrent partitions, epochs 0..1. Ops are real Nats (content
\* addresses) so the Merkle-root fold is exercised.
CONSTANTS
    Nodes = {n1, n2, n3}
    Ops = {1, 2}
    NumParts = 2
    MaxEpoch = 1
    None = None
SPECIFICATION Spec
INVARIANTS
    TypeOK
    LogSubsetOfWritten
    NoLostWrite
    DeterministicMerkleRoot
    PerPartitionOrder
    AtMostOneHolderPerEpoch
    GrantsAreFenced
PROPERTIES
    MonotonicLog
    Convergence
