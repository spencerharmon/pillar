\* Model-check configuration for VersioningCompat.
\* Small finite instance: two independently-versioned surfaces (s1, s2 --
\* enough to prove IndependentVersioning without eight near-identical
\* copies of the same seam), two cells (CellA = {p1, p2}, a single-member
\* CellB = {p3} -- enough to exercise both intra-cell (p1<->p2) and
\* cross-cell/federation (p1<->p3, p2<->p3) negotiation), a compat window
\* N = 2 (tolerates one version of lag before a release is blocked, so both
\* the "release proceeds" and "release blocks on a straggler" branches of
\* Bump's guard are reachable), and MaxVersion = 3 (two full release/upgrade
\* cycles past the window boundary -- enough to reach the fully-converged
\* steady state SwarmNeverPartitioned's liveness proof needs, while keeping
\* the state space small: peerVer has (MaxVersion+1)^(|Peers|*|Surfaces|) =
\* 4^6 = 4096 combinations).
CONSTANTS
    Surfaces = {s1, s2}
    CellA = {p1, p2}
    CellB = {p3}
    N = 2
    MaxVersion = 3
SPECIFICATION Spec
INVARIANTS
    TypeOK
    N1WindowHonored
    NoOrphanedMember
    NegotiationRefusesIncompatible
PROPERTIES
    IndependentVersioning
    RollingCoexistence
    SwarmNeverPartitioned
