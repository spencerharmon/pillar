\* Model-check configuration for NodeCustodyLogin (revised login model).
\* Small finite instance:
\*   - 2 nodes: n1 (owned/sealable) and nf (FOREIGN -- the cell never seals to
\*     it), with Owner = n1 the WoT anchor. Enough to exercise a trusted
\*     node-custody login on n1 and a client-signature-only login on the foreign
\*     node nf where the key never lands.
\*   - 1 operational (escrowable) user key k1; a distinct RootKey rk that is NOT
\*     an OpKey, so it is structurally never custodiable (no root injection).
\*   - 1 user u1 to exercise the one-shot create-user bootstrap capability.
\* This exercises: seal/de-seal (custody land + revoke), node-custody vs
\* client-signature admission paths, the WoT revoke-before-act + stale-view
\* fences (via RevokeKey/RefreshView + IssueEdge), the escrow
\* authority bound + subset-or-equal granted authority, and the one-shot
\* create-user capability with its deliberate-only re-enable.
CONSTANTS
    Nodes = {n1, nf}
    Owner = n1
    MaxDepth = 1
    None = NONE
    Users = {u1}
    OpKeys = {k1}
    RootKey = rk
    ForeignNodes = {nf}
SPECIFICATION Spec
INVARIANTS
    TypeOK
    FreshMarkBounded
    NodeHoldsKeyOnlyIfSealed
    UntrustedNodeNeverHoldsKey
    CustodyRevocable
    EscrowTypeBound
    CustodyAuthoritySubsetEqual
    NoActionAfterRevocation
    FailClosedUnderStaleView
    CreateUserRequiresCapability
    CapabilityIsOneShot
    CellLinkedToInitialUser
PROPERTIES
    ReEnableIsDeliberate
