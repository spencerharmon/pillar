\* Model-check configuration for Cells.
\* Small finite instance sufficient to exercise every property while keeping the
\* reachable state space tractable:
\*   2 nodes (member join/leave + forward-secrecy on leave),
\*   1 user (cross-cell grants: ReadOnly vs ReadWrite, All vs Tags),
\*   1 peer cell (PerCell recipient-sealed target space),
\*   1 object, 1 tag (tag-scoped grants), 1 publishable root (IPNS pointer).
\* MaxEpoch = 2 bounds key rotation (a leave + a stand-alone rotation suffice
\* to exercise forward secrecy and the write/rotation atomicity fence).
CONSTANTS
    Nodes = {n1, n2}
    Users = {u1}
    PeerCells = {pc1}
    Objects = {o1}
    Tags = {t1}
    Roots = {r1}
    None = NONE
SPECIFICATION Spec
INVARIANTS
    TypeOK
    VisibilitySound
    ForwardSecrecyOnLeave
    AtomicRotation
    GrantScopeRespected
    NamePtrResolves
