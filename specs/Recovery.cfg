\* Model-check configuration for Recovery.
\* Small finite instance: 2 subjects (exercising both tiers via the symbolic
\* Init over [Subjects -> Tiers]), 2 candidate WoT vouchers, 2 abstract
\* capabilities, 3 candidate recovery-key shares with a Shamir threshold K=2
\* (a real 2-of-3 k-of-n split), and the two tiers cell/user. Enough to
\* exercise: total-device-loss, cap revocation, voucher staleness/partition,
\* social re-vouch reaching (and failing to reach) the K-voucher threshold,
\* blob recovery reaching (and failing to reach) the K-share threshold on a
\* federation-restricted (and, via symbolic Init, an unrestricted) blob, and a
\* recovery attempted before and after each revocation.
CONSTANTS
    Subjects = {s1, s2}
    Vouchers = {v1, v2}
    Caps = {c1, c2}
    Shares = {sh1, sh2, sh3}
    K = 2
    Tiers = {"cell", "user"}
    None = None
SPECIFICATION Spec
INVARIANTS
    TypeOK
    FreshMarkBounded
    RecoveryPreservesAuthority
    NoRecoveryFromNothing
    ShamirThreshold
    NoActionAfterRevocation
    FailClosedUnderStaleView
