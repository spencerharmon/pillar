\* Model-check configuration for PillarUDP.
\* 3 nodes wired to exercise all three ROI communication shapes with a
\* single generic link mechanism (delivery/redundancy/dedup logic is
\* shape-agnostic):
\*   c  -- non-node pillar-UDP client, sprays over TWO parallel links
\*   n1 -- a cell node ({c,n1} is the one LOSSY edge -- the ROI's >= 1
\*         lossy-link mandate)
\*   k1 -- a second node reachable from c directly (non-lossy: the client's
\*         alternate spray path) and from n1 (the same generic link stands
\*         for both intra-cell node<->node and inter-cell cell<->cell --
\*         the mechanics genuinely do not differ)
\* {c,k1} and {n1,k1} being non-lossy gives every node a non-lossy path to
\* every other node despite the lossy {c,n1} edge -- exactly the multipath
\* topology the liveness property (Reachability) needs.
\*
\* Two messages: m1 (idempotent, originated by the client c) and m2
\* (exclusive/non-idempotent, originated by n1, processed only by the
\* remote lease holder k1) -- exercising both halves of
\* ExactlyOnceProcessing. Redundancy is set to cover every distinct directed
\* (cid,from,to) send this 3-node/3-edge graph can ever produce (2 * 3 = 6
\* per cid), so BoundedTotalDatagrams is checked as a genuine invariant of
\* the enforcement mechanism without it ever becoming the thing that starves
\* the Reachability liveness proof.
CONSTANTS
    c = c
    n1 = n1
    k1 = k1
    m1 = m1
    m2 = m2
    MaxHops = 2
    AmpFactor = 1
    MaxValidated = 2
SPECIFICATION Spec
INVARIANTS
    TypeOK
    ExactlyOnceProcessing
    BoundedTotalDatagrams
    NoForwardingLoops
    AntiAmplificationBound
PROPERTIES
    Reachability
