\* Model-check configuration for WebKeyAuth.
\* Small finite instance composed on top of the WoTAuthority authority model:
\* an Owner anchor plus one further subkey candidate, depth bound 0 (a direct
\* owner->subkey edge grants no onward delegation) -- enough to exercise a
\* chained vs. unchained subkey, the three revocation kinds, and Partition/
\* Heal/StaleView against Admit's revoke-before-act fence -- plus the web-login
\* layer: two candidate origins (one accepted, one wrong-origin), a 2-tick
\* clock so a live nonce can expire, and unlock / passkey-attestation of the
\* subkey. This is the largest instance kept exhaustively checkable in
\* check.sh's CI budget; a larger MaxDepth/Nodes/MaxTime/Origins is a valid
\* instance of the same spec but grows the reachable state space quickly.
CONSTANTS
    Nodes = {owner, n1}
    Owner = owner
    MaxDepth = 0
    None = None
    Origins = {good, evil}
    GoodOrigin = good
    MaxTime = 1
    MaxNonces = 1
    Passkeys = {n1}
SPECIFICATION Spec
INVARIANTS
    TypeOK
    FreshMarkBounded
    NoActionAfterRevocation
    FailClosedUnderStaleView
    WrongOriginRejected
    StaleNonceRejected
    ReplayRejected
    AdmitRequiresChainedUnlockedSubkey
    PasskeyPathEquivalent
