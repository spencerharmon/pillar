\* Model-check configuration for WoTAuthority.
\* Small finite instance: an owner anchor plus one further candidate
\* identity, and a depth bound of 0 (a directly-signed edge grants no
\* further delegation) -- enough to exercise a direct owner->subject edge,
\* a depth-exhausted (denied) two-hop attempt, all three revocation kinds,
\* and Partition/Heal/StaleView interleavings against Act's revoke-before-act
\* freshness guard. (A larger MaxDepth/Nodes is a valid instance of the same
\* spec but grows the reachable state space quickly; this is the largest
\* instance kept exhaustively checkable in check.sh's CI budget.)
CONSTANTS
    Nodes = {owner, n1}
    Owner = owner
    MaxDepth = 0
    None = None
SPECIFICATION Spec
INVARIANTS
    TypeOK
    FreshMarkBounded
    NoActionAfterRevocation
    FailClosedUnderStaleView
