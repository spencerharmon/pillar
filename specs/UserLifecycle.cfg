\* Model-check configuration for UserLifecycle (IAM user lifecycle).
\* Small finite instance:
\*   - 2 user handles {u1, u2} exercised through invite/login/force-change/
\*     disable/enable and role/group assignment interleavings.
\*   - 2 roles, 1 group, 2 capabilities. RoleCaps/GroupRoles are bound to the
\*     module's RoleCapsDef/GroupRolesDef (every role grants every cap, the
\*     group attaches every role) so the state space is finite while the
\*     structural lifecycle invariants are checked across all reachable states.
CONSTANTS
    Users  = {u1, u2}
    Roles  = {r1, r2}
    Groups = {g1}
    Caps   = {ca, cb}
CONSTANT
    RoleCaps   <- RoleCapsDef
    GroupRoles <- GroupRolesDef
SPECIFICATION Spec
INVARIANTS
    TypeOK
    InvitedForcesChange
    ForcedChangeContained
    DisabledNeverActive
    NoAmbientAuthority
