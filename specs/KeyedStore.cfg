\* Model-check configuration for KeyedStore.
\* Minimal finite instance: 2 nodes, 1 id, 1 field (K/V degenerate case --
\* Document's multi-field surface applies this SAME per-field fold
\* independently per field, so one field already exercises the fold logic),
\* 2 distinct values, physical clock 0..1, logical fixed at 0 (author is
\* still exercised as the tiebreak whenever two ops land on the same tick).
CONSTANTS
    Nodes = {n1, n2}
    Ids = {d1}
    Fields = {f1}
    Values = {v1, v2}
    MaxPhysical = 1
    MaxLogical = 0
SPECIFICATION Spec
INVARIANTS
    TypeOK
    HLCsDistinct
    DeterministicLWWTiebreak
    TombstoneWins
    NoLostUpdateUnderConcurrentPut
PROPERTIES
    HLCMonotonicPerField
