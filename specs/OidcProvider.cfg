\* Model-check configuration for OidcProvider (Pillar OIDC authority seam).
\* Small finite instance:
\*   - 2 end-users {u1, u2} and 2 clients {c1, c2}, so 4 (user,client) grants
\*     are exercised through the full authorization-code+PKCE / consent /
\*     token / refresh-rotation interleavings.
\*   - MaxRotations = 2 bounds refresh redemptions per grant so the state space
\*     is finite while single-use rotation is exercised across generations.
\* All four required safety properties are checked across every reachable state.
CONSTANTS
    Users        = {u1, u2}
    Clients      = {c1, c2}
    MaxRotations = 2
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoTokenWithoutConsumedCode
    RevokedConsentNeverIntrospectsValid
    DisabledUserNeverIntrospectsValid
    RefreshRotationSingleUse
