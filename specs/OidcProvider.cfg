\* Model-check configuration for OidcProvider (OIDC authorization-code+PKCE
\* grant, refresh rotation, consent, introspection).
\* Small finite instance: 2 users, 2 clients, 2 codes, 3 access-token slots
\* and 3 refresh-token slots (enough headroom for one full rotation beyond
\* the initial ConsumeCode-minted pair), and 2 PKCE verifier values (so a
\* mismatched-verifier ConsumeCode attempt is reachable but never fires) --
\* the largest instance kept exhaustively checkable in check.sh's CI budget.
CONSTANTS
    Users = {u1, u2}
    Clients = {c1, c2}
    CodeIds = {cd1, cd2}
    AccessIds = {a1, a2, a3}
    RefreshIds = {r1, r2, r3}
    PKCEVerifiers = {pv1, pv2}
    None = None
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoTokenWithoutConsumedCode
    RevokedConsentNeverIntrospectsValid
    DisabledUserNeverIntrospectsValid
    RefreshRotationSingleUse
