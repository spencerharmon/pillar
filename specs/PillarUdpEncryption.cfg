\* Model-check configuration for PillarUdpEncryption.
\* One cell with two member nodes (n1, n2) so a session authorized at one ingress
\* must converge to the other and be servable there (portability / failover). Two
\* client principals: pu (WoT-attested) and pa (anonymous/unattested) so the policy
\* invariant AnonIsUnattestedPrincipal ranges over both grant outcomes. Two ephemerals
\* (e1, e2) = two one-shot sessions, and two frames (f1, f2) so replay dedup has both
\* fresh and repeated content addresses. No -deadlock: "all sessions opened, served,
\* revoked and GC'd" is a legitimate terminal state. One legacy Noise-era session (l1),
\* disjoint from Eph, models the rollout window: it must coexist untouched by the
\* session-key scheme (LegacySessionKeyDisjoint, LegacyUnaffectedBySessionKey) and a
\* mixed cell state is reachable (MixedEraReachable).
CONSTANTS
    Nodes = {n1, n2}
    Principals = {pu, pa}
    AttestedPrincipals = {pu}
    Eph = {e1, e2}
    Frames = {f1, f2}
    LegacyEph = {l1}
SPECIFICATION Spec
INVARIANTS
    TypeOK
    SessionKeyCellSigned
    SessionConvergesOnOneKey
    SessionAuthorizedBeforeServe
    AnonIsUnattestedPrincipal
    SharedKeyReplayViaDedup
    LegacySessionKeyDisjoint
    LegacyUnaffectedBySessionKey
    MixedEraCoexistsSafely
PROPERTIES
    RevokedKeyEventuallyErased
