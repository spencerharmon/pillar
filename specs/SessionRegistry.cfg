\* Model-check configuration for SessionRegistry.
\* Small finite instance: 2 principals, 2 reusable session-id slots (enough
\* for one principal to hold >1 concurrent session -- exercising revoke-all's
\* sweep -- while a slot can still be minted, revoked, and re-minted within
\* the bound), 1 node, clock bound 2 (enough for expiry to fire), epoch
\* bound 2 (enough for revoke -> remint -> revoke again).
CONSTANTS
    Principals = {p1, p2}
    SessionIds = {s1, s2}
    Nodes = {n1}
    MaxClock = 2
    MaxEpoch = 2
    None = None
SPECIFICATION Spec
INVARIANTS
    TypeOK
    FreshMarkBounded
    MintEpochBounded
    RevokedAtBounded
    NoActionAfterRevocation
    NoActionAfterExpiry
    RevokeAllRevokesEvery
    FailClosedUnderStaleView
    RevocationHonorsEpoch
