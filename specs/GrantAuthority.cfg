\* Model-check configuration for GrantAuthority.
\* Small finite instance: the owner anchor plus one further identity, a
\* two-level authority lattice (0,1 -- enough for "grant never exceeds
\* granter" to bite and for a JIT elevation from 0 to 1), a 2-tick clock
\* (enough for a grant to be live at issue and dead after a Tick past its
\* expiry), and up to 2 grant ids (enough to exercise two concurrent grants,
\* revocation, and a full attestation-campaign sweep to convergence). A larger
\* instance is a valid instance of the same spec but grows the reachable state
\* space quickly; this is the largest kept exhaustively checkable in check.sh's
\* CI budget.
CONSTANTS
    Nodes = {owner, n1}
    Owner = owner
    MaxLevel = 1
    MaxTime = 2
    MaxGrants = 2
SPECIFICATION Spec
INVARIANTS
    TypeOK
    UniqueIds
    GrantNeverExceedsGranter
    ExpiredGrantNeverAdmits
    RevokedGrantNeverAdmits
    JitElevationIsBounded
    AttestationCampaignConverges
