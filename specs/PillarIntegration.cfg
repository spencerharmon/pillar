\* Model-check configuration for PillarIntegration.
\* Small finite instance: 2 scenarios, 2 surfaces, 2 oracles, 2 fixtures,
\* skip-deadline tick = 2. Both surfaces are claimed (so Gate 1 holds at seal:
\* no orphan surface). check.sh runs TLC with -deadlock: the sealed terminal
\* state (every scenario torn down, rig sealed) is expected quiescence.
CONSTANTS
    Surfaces  = {sfA, sfB}
    Scenarios = {scX, scY}
    Oracles   = {orP, orQ}
    Fixtures  = {fx1, fx2}
    Deadline  = 2
CONSTANT
    Claims   <- ClaimsDef
    ProvenBy <- ProvenByDef
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoDoubleCountedClaim
    NoStateSkipsTeardown
    Gate2_CoveredIsProven
    Gate1_NoOrphan
    Gate3_NoExpiredSkip
    NoSharedFixtureState
    TeardownReleasesFixtures
    NoResidueWhenSealed
