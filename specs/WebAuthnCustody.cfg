\* Model-check configuration for WebAuthnCustody (WebAuthn hardware-key custody).
\* Small finite instance:
\*   - 2 credential records c1, c2 (two authenticators / shared records).
\*   - 1 user handle u1 bound at registration.
\*   - 2 client surfaces {browser, cli} -- the crux: one shared record is
\*     read/written by BOTH, so a cred registered from one admits from the other.
\*   - MaxCount = 3 bounds the signature counter, the challenge-nonce source,
\*     and the PRF salt space, keeping the state space finite while still
\*     exercising: monotone-count clone detection (strict-increase refusal of a
\*     stale/equal count), single-use challenge freshness (issue / consume /
\*     expire, replay refusal), cross-surface admission (register browser -> assert
\*     cli and vice versa), and revoked-record fail-closed (a revoked cred never
\*     admits and is never revived).
CONSTANTS
    Creds = {c1, c2}
    Users = {u1}
    Cell = cell1
    Surfaces = {browser, cli}
    None = NONE
    MaxCount = 3
SPECIFICATION Spec
INVARIANTS
    TypeOK
    LastAssertCountStored
    ChallengeFreshness
    ChallengeNeverReissued
    CrossSurfaceUsability
    RevokedStaysDead
PROPERTIES
    SignCountMonotonic
    RevokedKeyNeverAdmits
