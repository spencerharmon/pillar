\* Model-check configuration for Bootstrap (the onboarding process).
\* Small finite instance: 2 candidate user primaries and 2 candidate node
\* subkeys, depth bound 1 -- enough to exercise the full ordered sequence
\* (keygen -> subkey signing -> cross-user trust -> depth/policy -> discovery),
\* an out-of-order attempt at every step (structurally disabled by the guards),
\* a one-hop cross-user trust edge and a depth-exhausted attempt, and the
\* coordination core toggling up/down beneath the whole flow.
CONSTANTS
    Users = {u1, u2}
    Subkeys = {k1, k2}
    MaxDepth = 1
    None = None
SPECIFICATION Spec
INVARIANTS
    TypeOK
    CoordCoreNeverBootstrapDep
    AuthorityCorrectOfSequence
    FailClosedOutOfOrder
