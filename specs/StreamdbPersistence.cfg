\* Model-check configuration for StreamdbPersistence.
\* Small finite instance kept tight so exhaustive TLC (including the <>[]
\* liveness RehydrateReconverges) terminates quickly: 2 nodes, 2 sealed
\* segments (real Nats, standing in for ordinary log segments AND the sealed
\* cell-key blob), a disjoint 2-element node-key universe (so
\* NodeKeyNeverOnIPFS is exercised against a non-vacuous alternative -- TLC
\* must actually confirm no action ever pins/publishes a node key, not merely
\* that the type forbids it), head sequence numbers 0..2, and up to 1 wipe
\* per node (enough to exercise a full wipe -> rehydrate -> reconverge cycle
\* while keeping Wipe finite, which the liveness proof requires).
CONSTANTS
    Nodes = {n1, n2}
    Segments = {1, 2}
    NodeKeys = {k1, k2}
    MaxSeq = 2
    MaxWipes = 1
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoLostWrite
    NodeKeyNeverOnIPFS
    ViewIsDerived
PROPERTIES
    HeadSequenceMonotonic
    RehydrateReconverges
