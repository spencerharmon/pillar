\* Model-check configuration for AntiEntropy.
\* Small finite instance: 3 authors/replicas (enough for a non-trivial
\* partition topology), per-author chains bounded to length 2, up to 2
\* concurrent partitions (fully connected, or split).
CONSTANTS
    Authors = {a1, a2, a3}
    MaxSeq = 2
    NumParts = 2
SPECIFICATION Spec
INVARIANTS
    TypeOK
    CausallyClosed
    LogSubsetOfWritten
    NoLostWrite
    SelfComplete
PROPERTIES
    Completeness
