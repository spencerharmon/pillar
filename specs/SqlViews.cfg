\* Model-check configuration for SqlViews.
\* Minimal finite instance: 1 ordinary collection (a second would only
\* duplicate the same per-collection fold), 2 view ids (enough to exercise
\* NoMigrationOnNewView -- one already-existing view, one freshly created),
\* 2 document ids, 2 fields (a filter field + a second unrelated field, to
\* exercise ViewIsPureFoldOfSources's "unrelated write never moves an
\* unrelated view"), 2 values. A CONSTRAINT bounds the log length so the
\* state space stays finite for TLC (the fold/log model is otherwise
\* unbounded, like a real append-only log).
CONSTANTS
    Collections = {c1}
    ViewIds = {v1, v2}
    Ids = {d1, d2}
    Fields = {f1, f2}
    Values = {val1, val2}
SPECIFICATION Spec
INVARIANTS
    TypeOK
PROPERTIES
    ViewIsPureFoldOfSources
    NoMigrationOnNewView
    CatalogChangeNeverMutatesRow
CONSTRAINT LenConstraint
