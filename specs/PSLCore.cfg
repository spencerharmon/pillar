\* Model-check configuration for PSLCore.
\*
\* Small finite instance kept exhaustively checkable in CI budget: two signal
\* kinds, two label keys, two label values, two correlation ids, three
\* timestamps, three ingested signals, a window of 1, one regex-matched value,
\* and a 6-query construction bound -- enough to exercise all six `where`
\* matchers (=, !=, =~, !~, in(...), range), both correlate axes (corr + a
\* shared label), anchored AND anchorless correlation, and the window-join's
\* straddle boundary for every proven property, without combinatorial blow-up.
\*
\* `sig` (the CorrelationIndex contents) is CHOOSEn deterministically over the
\* Signals -> Envelope space; TLC pins it to one concrete function per run, and
\* the invariants hold for whichever it picks (they are universally quantified
\* over the query space, not over a particular `sig`).
CONSTANTS
    Kinds = {metrics, logs}
    LabelKeys = {cell, node}
    LabelVals = {v1, v2}
    CorrIds = {c1, c2}
    Times = {0, 1, 2}
    Signals = {s1, s2, s3}
    Windows = {0, 1, 2}
    RegexVals = {v1}
    None = None
    s1 = s1
    s2 = s2
    s3 = s3
    metrics = metrics
    logs = logs
    cell = cell
    node = node
    v1 = v1
    v2 = v2
    c1 = c1
SPECIFICATION Spec
INVARIANTS
    TypeOK
    CorrelationSymmetric
    WindowBoundHonored
    SurfaceEquivalence
